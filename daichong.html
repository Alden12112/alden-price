<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务中心</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background:#000; color:#fff; padding:40px 20px; text-align:center; }
        h2 { color:#ffd700; margin-bottom:10px; }
        .area { color:#ffd700; font-weight:bold; margin-bottom:30px; }
        .menu { display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:400px; margin:0 auto; }
        .menu a { background:#ffd700; color:#000; padding:18px 10px; border-radius:12px; font-weight:bold; text-decoration:none; }
        .back { margin-top:40px; }
        .back a { color:#ffd700; }
    </style>
</head>
<body>

<h2>代充服务中心</h2>
<p class="area" id="showArea">加载中...</p>

<div class="menu">
    <a id="m1">代充</a>
    <a id="m2">代送</a>
    <a id="m3">苹果卡</a>
    <a id="m4">转区</a>
    <a id="m5">返厂皮肤</a>
    <a id="m6">代抽</a>
    <a id="m7">人脸</a>
    <a id="m8">汇率</a>
</div>

<div class="back"><a href="price.html">← 返回</a></div>

<script>
const url = new URLSearchParams(window.location.search);
const area = url.get('area') || "V区";
document.getElementById('showArea').innerText = "当前大区：" + area;

const list = ["代充","代送","苹果卡","转区","返厂皮肤","代抽","人脸","RMB汇率"];
for(let i=0;i<8;i++){
    document.getElementById(`m${i+1}`).href = `service.html?area=${area}&type=${list[i]}`;
}
</script>

</body>
</html>
