<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代充信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background: #000;
            color: #fff;
            padding: 30px 20px;
        }
        .box {
            background: #000;
            border: 1px solid #ffd700;
            max-width: 450px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
        }
        h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #fff;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #ffd700;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }
        .back {
            text-align: center;
            margin-top: 20px;
        }
        .back a {
            color: #ffd700;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>代充信息填写</h2>

    <form id="orderForm">
        <div class="input-group">
            <label>游戏昵称</label>
            <input type="text" id="nick" required>
        </div>
        <div class="input-group">
            <label>系统（iOS / 安卓）</label>
            <select id="sys" required>
                <option value="">请选择</option>
                <option value="iOS">iOS</option>
                <option value="安卓">安卓</option>
            </select>
        </div>
        <div class="input-group">
            <label>微信 / QQ</label>
            <input type="text" id="contact" required>
        </div>
        <div class="input-group">
            <label>充值数量</label>
            <input type="text" id="amount" required>
        </div>
        <div class="input-group">
            <label>是否实名</label>
            <select id="real" required>
                <option value="">请选择</option>
                <option value="已实名">已实名</option>
                <option value="未实名">未实名</option>
            </select>
        </div>
        <button type="submit">提交信息</button>
    </form>

    <div class="back">
        <a href="price.html">← 返回价格表</a>
    </div>
</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
    e.preventDefault();

    let nick = document.getElementById("nick").value;
    let sys = document.getElementById("sys").value;
    let contact = document.getElementById("contact").value;
    let amount = document.getElementById("amount").value;
    let real = document.getElementById("real").value;

    let msg = "新订单！%0A";
    msg += "游戏昵称：" + nick + "%0A";
    msg += "系统：" + sys + "%0A";
    msg += "联系方式：" + contact + "%0A";
    msg += "充值数量：" + amount + "%0A";
    msg += "实名：" + real;

    // 直接发送到你的 WHATSAPP
    window.open("https://wa.me/60178541111?text=" + msg);

    alert("提交成功！5秒后跳转到付款页面");
    setTimeout(function(){
        window.location.href = "tng.html";
    },5000);
});
</script>
</body>
</html>
