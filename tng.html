<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>付款信息 | Alden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #121212;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 45px 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border-top: 4px solid #ffd700;
            text-align: center;
        }
        .payment-img {
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            margin: 20px auto;
            display: block;
        }
        .card h1 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 28px;
        }
        .info-box {
            background: #292929;
            padding: 20px;
            border-radius: 12px;
            margin: 12px 0;
            text-align: left;
        }
        .info-box p {
            color: #eee;
            font-size: 16px;
            margin: 8px 0;
        }
        .label {
            color: #ffd700;
            font-weight: bold;
        }
        .warn {
            background: #292520;
            border-left: 4px solid #ff9800;
            padding: 16px;
            margin: 20px 0;
            border-radius: 8px;
            color: #ffcc80;
            text-align: left;
            font-size: 15px;
        }
        .btns {
            text-align: center;
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 28px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            margin: 6px;
            transition: 0.3s;
        }
        .btn-back { background: #444; color: white; }
        .btn-wa { background: #25D366; color: white; }
        .btn:hover { transform: translateY(-3px); }
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>📌 TNG 付款码</h1>
    <img class="payment-img" src="https://i.imgur.com/rcRvMNx.jpeg">

    <div class="info-box">
        <p><span class="label">姓名：</span> Alden Lau</p>
        <p><span class="label">号码：</span> 017-8541111</p>
    </div>

    <div class="warn">⚠️ 付款后请务必发送截图给客服，否则会延迟处理！</div>

    <div class="btns">
        <a href="price.html" class="btn btn-back">返回价格表</a>
        <a href="https://wa.me/60178541111" class="btn btn-wa" target="_blank">发送截图</a>
    </div>

    <div class="footer">© Alden Service 2025</div>
</div>

</body>
</html>
