<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>付款页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background: #000;
            color: #fff;
            padding: 30px 20px;
            text-align: center;
        }
        .box {
            max-width: 450px;
            margin: 0 auto;
            padding: 35px 30px;
            border: 1px solid #ffd700;
            border-radius: 20px;
            background: #0a0a0a;
        }
        h2 {
            color: #ffd700;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .timer {
            color: #ff3333;
            font-size: 26px;
            font-weight: bold;
            margin: 15px 0;
        }
        .info {
            margin: 12px 0;
            font-size: 16px;
            color: #fff;
        }
        .label {
            color: #ffd700;
            font-weight: bold;
        }
        .qr-img {
            width: 220px;
            height: 220px;
            margin: 20px auto;
            border: 2px solid #ffd700;
            border-radius: 10px;
            object-fit: cover;
        }
        .warn {
            color: #ff4444;
            margin: 10px 0;
            font-size: 14px;
        }
        .back {
            margin-top: 30px;
        }
        .back a {
            color: #ffd700;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>💰 付款页面</h2>
    <p>请在限时内完成付款</p>
    <div class="timer" id="count">5:00</div>

    <div class="info">
        <span class="label">姓名:</span> Alden
    </div>
    <div class="info">
        <span class="label">号码:</span> 0178541111
    </div>

    <!-- 这里是你最后发我的正确图片 -->
    <img src="https://i.imgur.com/rcRvMNx.jpeg" class="qr-img">

    <div class="warn">
        ⚠️ 5分钟未付款自动取消订单
    </div>
</div>

<div class="back">
    <a href="index.html">← 返回首页</a>
</div>

<script>
let sec = 300;
function timer() {
    let m = Math.floor(sec / 60);
    let s = sec % 60;
    document.getElementById("count").innerText = `${m}:${s < 10 ? "0"+s : s}`;
    sec--;
    if(sec < 0) {
        alert("付款时间已过期！请重新下单");
        window.location.href = "form.html";
    }
}
setInterval(timer, 1000);
</script>

</body>
</html>
