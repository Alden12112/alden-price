<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alden 价格网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .cover {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff4d4d, #ff8a3d);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .cover h1 {
            font-size: 36px;
            margin-bottom: 15px;
            animation: zoom 2s infinite alternate;
        }
        .cover p {
            font-size: 18px;
            margin-bottom: 40px;
            animation: fade 2s infinite alternate;
        }
        .btn {
            padding: 15px 35px;
            background: white;
            color: #ff4d4d;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            animation: zoom 1.2s infinite alternate;
            margin-bottom: 15px;
        }
        .whatsapp {
            background: #25D366;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
        @keyframes zoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        @keyframes fade {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="cover">
        <h1>欢迎来到 Alden 的价格网站</h1>

</body>
</html>
