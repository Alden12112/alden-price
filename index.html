<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 50px;
            color: #ffd700;
            animation: zoom 1.8s infinite alternate, glow 2s infinite alternate;
        }
        @keyframes zoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        @keyframes glow {
            0% { text-shadow: 0 0 10px #ffd700; }
            100% { text-shadow: 0 0 30px #ffd700; }
        }
        .info {
            color: #ccc;
            margin: 20px 0;
            font-size: 15px;
            opacity: 0.8;
        }
        .btns a {
            background: #ffd700;
            color: #000;
            padding: 15px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin: 8px;
            display: inline-block;
            transition: 0.3s;
        }
        .btns a:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px #ffd700;
        }
        .wa {
            background: #25D366 !important;
            color: #fff !important;
        }
        .wa:hover {
            box-shadow: 0 0 20px #25D366 !important;
        }
        .foot {
            color: #555;
            margin-top: 50px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Alden Premium</h1>
    <p class="info">24小时在线 | 安全可靠 | 极速处理</p>
    <div class="btns">
        <a href="price.html">价格表</a>
        <a href="https://wa.me/60178541111" class="wa">联系客服</a>
    </div>
    <p class="foot">© Alden 2025</p>
</body>
</html>
